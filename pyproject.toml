[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windforecast"
version = "0.1.0"
description = "Short-term wind power forecasting with ML (46W38 Project 3)"
authors = [{ name = "Luca Paniagua" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pylint", "flake8", "black"]

[tool.black]
line-length = 79

[tool.pylint.format]
max-line-length = 79